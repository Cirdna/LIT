[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-analyzer"
version = "0.1.0"
description = "Standardized PDF contract analyzer engine (dual VLM+OCR pipeline, 41-CUAD extraction)"
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.24",
    "requests>=2.31",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "rapidfuzz>=3.6",
    "pydantic>=2.6",
    "playwright>=1.42",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Only needed for the local `qwen` / `internvl` backends. The default
# OpenRouter backend talks HTTP, so a hosted install skips ~2.5GB of wheels.
local = [
    "torch>=2.2",
    "transformers>=4.49",
    "accelerate>=0.30",
    "qwen-vl-utils>=0.0.8",
    "torchvision>=0.17",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
